# =============================================================================
# rft/configs/grpo_15h_lora.yaml — RTX 6000 PRO (Blackwell 96GB), 15h 예산
#
# ★ 실행:
#     export VLA_STAGED_REWARD=1
#     ~/env_eval/bin/python -u rft/grpo_fallback.py \
#         --config rft/configs/grpo_15h_lora.yaml --checkpoint ckpt/sft
#
# ★ grpo_15h.yaml 과 다른 점 (전부 실측 근거가 있다)
#   1) LoRA 를 실제로 붙인다. 예전 설정은 use_lora 항목 자체가 없어서
#      7.54B 풀 파인튜닝이 조용히 돌았다 (체크포인트가 병합본이라 전 파라미터가
#      requires_grad=True 다). 지금은 110.8M(1.47%)만 학습한다.
#   2) learning_rate 를 1e-6 → 1e-5 로 올렸다. 1e-6 은 **풀 파인튜닝 기준**
#      값이다 (SimpleVLA-RL 5e-6 을 배치 크기로 스케일한 값). LoRA 는 같은
#      크기의 갱신을 내려면 10배 이상 큰 lr 이 필요하다. 근거는 아래 §lr.
#   3) total_steps 를 실측으로 다시 잡았다 (360 → 220). 아래 §시간.
#
# =============================================================================
# §시간 — 실측 기반 (2026-08-16, 이 머신. 본 학습 첫 3스텝으로 재검증됨)
#
#   롤아웃  ~28초 / 그룹   (num_envs=8, max_steps_per_episode=200, 8에피소드)
#   업데이트 ~34초 / 그룹·epoch (25청크 × 8env forward+backward)
#   기동     ~30초 (모델 로드 + 워커) — 1회성
#
#   한 스텝 = (시도 횟수 × 28초) + (유효 그룹 수 × 34초 × ppo_epochs)
#     보통  2시도 2유효 2ep = 192초 = 3.2분   ← 실측 무신호그룹 0% (train_mix)
#     악화  4시도 2유효 2ep = 248초 = 4.1분   ← 무신호 50% 가정
#
#   12.5시간(750분) 학습 + 1.5시간 여유(최종 평가·재시작 대비) 로 잡으면
#     보통 750/3.2 = 234 스텝 / 악화 750/4.1 = 183 스텝
#   → 200 으로 둔다. 평가·저장 오버헤드는 ~2% 수준이라 무시할 만하다.
#
#   ⚠ 끝까지 돌 필요는 없다. save_every 마다 어댑터가 남으므로 시간이 되면
#     그 시점 체크포인트로 결과가 성립한다 (인수인계 문서 §3-5).
#   ⚠ 첫 10스텝의 실제 elapsed_min 을 보고 어긋나면 groups_per_step 을 먼저 줄일 것.
# =============================================================================

checkpoint: ""
task: VlaPlace-v0
# ★ 커리큘럼 30% 혼합. 원래 분포는 트레이 진입률이 2.5% 라 마지막 단계에
#   신호가 거의 없다. 평가는 아래 evaluate() 가 eval_base 로만 한다.
bank: train_mix
unnorm_key: vla_pick
isaaclab_python: ~/env_isaaclab/bin/python

num_envs: 8
group_size: 8                     # SimpleVLA-RL 의 data.n_samples=8 과 동일
groups_per_step: 2
max_steps_per_episode: 200
dynamic_sampling: true
max_group_attempts: 6             # 0(=3배)과 같지만 시간 상한을 명시적으로 둔다

# 온도. SimpleVLA-RL 은 1.6 이지만 그건 성공률이 이미 높은 정책 기준이다.
# 우리 정책은 성공 0% 라 1.6 이면 궤적이 망가져 단계 신호까지 잃는다.
# 실측: 1.2 에서 무신호그룹 0%/50% 로 그룹 내 분산이 충분했다.
# 로그의 무신호그룹이 계속 80%+ 면 1.4 로 올릴 것.
temperature: 1.2

# =============================================================================
# §lr — 이 설정에서 가장 불확실한 값이다
#
#   경로 1) SimpleVLA-RL 5e-6 (풀 파인튜닝, 배치 64×8=512궤적)
#           우리 배치는 2×8=16궤적 → 32배 작다. sqrt 스케일링 → 5e-6/5.7 ≈ 9e-7
#           즉 기존 1e-6 은 "풀 파인튜닝이었다면" 타당한 값이었다.
#           LoRA 보정 10배 → 1e-5
#   경로 2) 이 프로젝트 SFT 가 같은 어댑터(r32,α16)에 5e-4 를 썼다.
#           RL 은 SFT 의 1/50 수준이 관례 → 1e-5
#
#   두 경로가 1e-5 로 수렴한다. 다만 α/r=0.5 라 갱신이 절반으로 스케일되므로
#   보수적인 편이다.
#
#   ppo_epochs=2 라 스텝당 실효 이동은 ~2e-5 상당이다. 대신 epoch 2 부터
#   클리핑이 실제로 작동해 과도한 이동을 잘라 준다 (로그의 clip 비율로 감시).
#
#   모니터링: 20스텝(≈1시간)째 eval 을 보고
#     - 파지/리프트가 베이스라인(파지 5~12%) 아래로 무너지면 → 발산. 5e-6 으로 재시작
#     - 40스텝까지 단계 도달률이 완전히 평평하면 → 신호 부족. 2e-5~3e-5 로 올림
#     - clip 비율이 50%+ 로 상시 붙으면 → 한 스텝 이동이 과대. lr 을 5e-6 으로
# =============================================================================
learning_rate: 1.0e-5

# PPO inner epoch. 2 로 두면 두 번째 패스에서 ratio ≠ 1 이 되어 클리핑
# (트러스트 리전)이 실제로 작동한다. 1 이면 ratio≡1 이라 실효 REINFORCE.
#   - 시간: epoch 하나가 +68초/스텝 (2그룹 × 34초). 새 롤아웃 스텝(124초)보다
#     싸므로, 같은 벽시계 시간에 ~1.45배 더 학습한다.
#   - SimpleVLA-RL 은 512궤적에 4회 — 우리는 16궤적이라 2회로 제한한다
#     (작은 배치에 4회는 그 배치의 노이즈에 과적합).
#   - epoch 2 는 같은 lr 로 한 번 더 밟는 것이라 스텝당 실효 이동이 ~2배다.
#     그 만큼을 클리핑이 감시한다 — 로그의 clip/r≤ 가 그 계기판이다.
ppo_epochs: 2

# 클리핑 값은 SimpleVLA-RL(clip_ratio_low=0.2 / clip_ratio_high=0.28, DAPO
# clip-higher)과 동일. ppo_epochs>=2 에서만 의미가 있다.
# ⚠ 우리 ratio 는 청크(56토큰) logp **합**의 지수라 토큰 단위보다 민감하다.
#   로그의 clip 비율이 50% 를 넘으면 lr 을 내릴 것.
clip_eps: 0.2
clip_eps_high: 0.28

kl_coef: 0.0                      # SimpleVLA-RL 과 동일 (kl_ctrl.kl_coef=0.00)
max_grad_norm: 1.0                # SimpleVLA-RL grad_clip=1 과 동일
total_steps: 200

# --- LoRA (SFT 와 같은 형상) ---
# SimpleVLA-RL 은 LoRA 를 쓰지 않는다(8×A800 FSDP 풀 파인튜닝)므로 물려받을
# rank 가 없다. SFT 어댑터를 승계했고, 실측으로 등가성을 확인했다:
#   대상 모듈 439개 일치 / 학습 파라미터 110.8M 일치 / 부착 직후 액션 차이 0.
use_lora: true
lora_rank: 32
lora_alpha: 16
lora_dropout: 0.0

log_dir: logs/grpo_15h_lora
# 20스텝 ≈ 1시간. 저장은 어댑터만(484MB)이라 몇 초, 평가는 16에피소드에 약 1분
# → 합쳐서 학습 시간의 1.5% 수준이다. 둘을 같은 주기로 둬야
# "이 체크포인트가 몇 % 였는가" 가 바로 대응된다.
save_every: 20
eval_every: 20
# 16 → 32. 실측에서 8에피소드 평가가 파지 0% / 25% 로 튀었다 (같은 조건).
# 32 에피소드면 노이즈가 절반으로 줄고, 비용은 ~120초 × 10회 = 20분에 불과하다
# (전체 11시간의 3%). eval_base 뱅크에 64개가 있으므로 중복 없이 뽑힌다.
# ⚠ 그래도 결론용은 아니다. 인수인계 문서는 40 에피소드로도 부족하다고 본다
#   (같은 체크포인트에서 파지율 5%/7.5%/15%). 학습 중 평가는 **추세 판단용**이고,
#   최종 숫자는 끝난 뒤 최고 체크포인트로 100+ 에피소드를 따로 잴 것.
eval_episodes: 32

wandb_project: ""
device: cuda:0
seed: 0
