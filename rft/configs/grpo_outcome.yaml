# =============================================================================
# rft/configs/grpo_outcome.yaml — 표준 GRPO (outcome-only, 커리큘럼 없음)
#
# ★ 실행 (★ VLA_STAGED_REWARD 를 켜지 말 것):
#     unset VLA_STAGED_REWARD
#     ~/env_eval/bin/python -u rft/grpo_fallback.py \
#         --config rft/configs/grpo_outcome.yaml --checkpoint ckpt/sft
#
# =============================================================================
# §왜 설계를 바꿨나 — 문서의 전제가 이 머신에서 성립하지 않는다
#
# 인수인계 문서의 RFT 설계(단계형 보상 + 커리큘럼 뱅크)는 전부 "SFT 성공률 0%"
# 에서 나왔다. 이 머신에서 같은 홀드아웃·같은 스크립트로 재측정한 결과:
#
#   | 항목        | 문서(L40S) | 이 머신(RTX 6000 PRO) |
#   |-------------|-----------|----------------------|
#   | 성공        | 0% (0/40) | **20.3% (13/64)**    |
#   | 트레이 진입 | 0% (0/40) | **20.3% (13/64)**    |
#   | 파지        | 5.0%      | 40.6%                |
#   | lifted      | 7.5%      | 43.8%                |
#   | 블록 최고높이| 111mm     | 363mm                |
#
#   (scripts/eval_rollout.py --checkpoint ckpt/sft --bank eval_base
#    --num-episodes 64, 300스텝 greedy. 결과: logs/sft_baseline_thismachine.json)
#
# 최고높이가 3배 넘게 다른 것으로 보아 PhysX 거동 자체가 갈렸다(GPU 아키텍처
# 차이로 추정). 어느 쪽이 "맞다" 가 아니라, **이 머신의 기준선은 20.3%** 라는
# 것이 사실이고 RFT 는 여기에 맞춰야 한다.
#
# 따라서:
#   1) 단계형 보상 불필요 → outcome-only. 성공률 20.3% 면 그룹(G=8)이
#      전멸·전승이 아닐 확률이 84% 라 신호가 넉넉하다. 오히려 부분 점수
#      (파지 0.2 / 리프트 0.4)는 이미 20% 완수하는 정책을 "부분 점수 수확"
#      국소 최적으로 끌어당길 위험이 있다.
#   2) 커리큘럼 뱅크 불필요 → bank: train. 원래 분포에서 진입이 20.3% 다.
#      OOD 위험과 전이 불확실성을 통째로 제거한다.
#   3) SimpleVLA-RL 이 17.3% → 91.7% 를 낸 출발점과 거의 같은 지점이다.
# =============================================================================

checkpoint: ""
task: VlaPlace-v0
bank: train                       # ★ 커리큘럼 없음 — 원래 분포를 직접 최적화
unnorm_key: vla_pick
isaaclab_python: ~/env_isaaclab/bin/python

num_envs: 8
group_size: 8                     # SimpleVLA-RL data.n_samples=8 과 동일
groups_per_step: 2
dynamic_sampling: true
max_group_attempts: 6

# ★ 200 → 300. 이게 학습 신호를 깎고 있었다.
#   8Hz 데모 궤적 길이가 **평균 202스텝**이다 (docs/DATASET.md: 24Hz 598스텝을
#   3배 다운샘플한 이유가 "1500개 전부 예산 300 안에" 들어오게 하는 것이었다).
#   200 에서 끊으면 데모 절반이 예산을 넘고, 201~300 스텝에서 났을 성공이
#   조용히 사라진다 — 환경은 300 을 허용하는데(episode_length_s 기본값)
#   수집기가 25청크만 돌고 멈추기 때문이다.
#   기준선 20.3% 도 300스텝 측정값이라, 이제 학습·평가·기준선이 모두 300 이다.
max_steps_per_episode: 300

temperature: 1.2

# =============================================================================
# §lr — 1e-5 → 2e-5
#   직전 실행(lr 1e-5, 단계형+커리큘럼, 200스텝)은 46스텝 동안 평평했다.
#   원인이 lr 인지 설계 불일치인지 분리되지 않지만, 남은 시간이 한 번뿐이라
#   "평평한 채 끝날" 위험이 "발산" 위험보다 크다고 본다.
#   근거: SimpleVLA-RL 5e-6 은 512궤적 풀 파인튜닝. 우리는 16궤적(1/32)이지만
#   LoRA 라 같은 갱신에 10배 이상이 필요하다. ppo_epochs=2 의 클리핑이
#   과도한 이동을 잘라 주므로 직전보다 공격적으로 갈 여지가 있다.
#   ⚠ 로그의 clip 이 50% 를 상시 넘거나 r≤ 가 단조 상승하면 즉시 낮출 것.
# =============================================================================
learning_rate: 2.0e-5

clip_eps: 0.2                     # SimpleVLA-RL clip_ratio_low
clip_eps_high: 0.28               # SimpleVLA-RL clip_ratio_high (DAPO clip-higher)
kl_coef: 0.0                      # SimpleVLA-RL kl_ctrl.kl_coef=0.00
max_grad_norm: 1.0                # SimpleVLA-RL grad_clip=1
ppo_epochs: 2                     # epoch 2 부터 ratio≠1 → 클리핑이 실제로 작동

use_lora: true
lora_rank: 32                     # SFT 어댑터와 동일 형상 (모듈 439개·110.8M 일치)
lora_alpha: 16

# =============================================================================
# §시간 — 300스텝으로 늘어난 만큼 재산정 (12:55 시작, 마감 01:05 = 12.2h)
#   롤아웃   ~43초/그룹  (38청크 × 8env. 200스텝 28초 → ×38/25)
#   업데이트 ~52초/그룹·epoch
#   한 스텝  = 2.2시도×43 + 2유효×52×2ep ≈ 300초 = 5.0분
#   여유 1.5h 를 빼고 10.7h → 약 128 스텝. 평가 오버헤드까지 보면 ~125.
#   → 130 으로 둔다. 끝까지 돌 필요 없다 — save_every 마다 어댑터가 남는다.
# =============================================================================
total_steps: 130

log_dir: logs/grpo_outcome
# 15스텝 ≈ 75분. 평가는 32에피소드 × 300스텝 = 4라운드 ≈ 3분.
save_every: 15
eval_every: 15
eval_episodes: 32

wandb_project: ""
device: cuda:0
seed: 0
