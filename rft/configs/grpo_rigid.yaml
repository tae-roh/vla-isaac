# =============================================================================
# rft/configs/grpo_rigid.yaml
# 블록 배치 태스크 RFT — 이 프로젝트의 핵심 결과를 내는 설정.
#
# ★ 이 파일 하나가 클리어런스 곡선의 **점 하나**다.
#   다른 split 을 돌릴 때는 `task` 와 `log_dir` 을 **함께** 바꾼다
#   (섞이면 어느 점이 무엇으로 학습된 것인지 알 수 없다).
#   돌리기 전에 그 split 의 SFT 성공률이 30% 이상인지 확인할 것 (개정 §5 게이트).
#
# 규모는 축소했다:
#   SimpleVLA-RL 레퍼런스가 8× A100 에서 스텝당 ~20분(롤아웃 88%), 300스텝 ~4.3일.
#   그건 LIBERO(MuJoCo/OpenGL) 기준이고 Isaac Lab 은 렌더가 더 무겁다.
#   → 그룹 크기 / 에피소드 길이 / num_envs 를 모두 줄여 스텝 시간을 관리한다.
#
# 시간 예산 잡는 법:
#   한 스텝 = groups_per_step × (에피소드 길이 / 청크 8) × num_envs 번의 정책 forward
#           = 2 × (200/8) × 8 = 400회
#   첫 20스텝의 실제 소요를 보고 total_steps 를 조정할 것. 커브가 오르기 시작하는
#   것만 확인되면 되므로, 끝까지 돌릴 필요는 없다.
# =============================================================================

checkpoint: ""                    # --checkpoint 로 넘기거나 여기에 채운다
task: VlaPlace-v0                 # 등록된 태스크는 이것 하나뿐이다
bank: train                       # 초기 상태 뱅크. 평가 홀드아웃(eval_base)과 달라야 한다
isaaclab_python: ~/env_isaaclab/bin/python

# --- 롤아웃 ---
# num_envs 를 그룹 크기로 그대로 쓴다: 한 번의 reset 으로 만든 배치가 곧 한 그룹.
# ★ 그룹 내 초기 상태 공유는 시드가 아니라 **뱅크 인덱스**로 보장한다 (개정 §3).
#   collect_group(init_index=…) 가 전 env 에 같은 s₀ 를 넣는다.
num_envs: 8
group_size: 8
groups_per_step: 2

# 에피소드를 짧게 자른다. 스텝 시간에 선형으로 들어가는 항목이라 여기가 가장 효과적이다.
# 200스텝이면 24Hz 기준 8초 — 이 태스크에 충분하다.
max_steps_per_episode: 200

# 탐색 온도. 개정 §5 는 SimpleVLA-RL 값 1.6 을 쓴다.
# 낮으면 그룹이 전멸/전승으로 쏠려 advantage 가 0 이 되고(무신호 그룹),
# 높으면 궤적이 망가져 성공이 아예 안 나온다. 로그의 '무신호그룹' 비율을 보고 조정.
temperature: 1.6

# --- 최적화 ---
learning_rate: 1.0e-6
clip_eps: 0.2
# clip-higher (DAPO): 유효 구간 [0.8, 1.28]. 상한을 넓혀 저확률 토큰이 올라올
# 여지를 준다 — 대칭 클리핑은 엔트로피를 빨리 죽여 탐색이 멎는다.
clip_eps_high: 0.28
# SimpleVLA-RL 기본은 KL 항 없음. 정책이 발산하면 0.01 정도부터 켜 본다.
kl_coef: 0.0
max_grad_norm: 1.0
total_steps: 300

# --- 로깅 ---
log_dir: logs/grpo_rigid
save_every: 25
eval_every: 25
wandb_project: ""                 # 채우면 wandb 로 보낸다 (아웃바운드라 포트 개방 불필요)

device: cuda:0
seed: 0
